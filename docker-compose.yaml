services:
  han-graph:
    build: .
    restart: unless-stopped
    user: "${HAN_GRAPH_UID:-1000}:${HAN_GRAPH_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["-data", "/app/dataset", "-accounts", "/app/var/accounts.db", "-addr", "0.0.0.0:18080", "-secure-cookies=${HAN_GRAPH_SECURE_COOKIES:-false}", "serve"]
    environment:
      HAN_GRAPH_DB_BACKEND: ${HAN_GRAPH_DB_BACKEND:-file}
      HAN_GRAPH_SIGNUP_MODE: ${HAN_GRAPH_SIGNUP_MODE:-open}
      HAN_GRAPH_BETA_INVITE_CODE: ${HAN_GRAPH_BETA_INVITE_CODE:-}
      HAN_GRAPH_GOOGLE_CLIENT_ID: ${HAN_GRAPH_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      FIRESTORE_DATABASE_ID: ${FIRESTORE_DATABASE_ID:-(default)}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-}
    ports:
      - "${HAN_GRAPH_HOST:-0.0.0.0}:${HAN_GRAPH_PORT:-18080}:18080"
    volumes:
      - type: bind
        source: ./var
        target: /app/var
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/api/stats"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s
    networks:
      - han-graph-net

networks:
  han-graph-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.230.9.0/24
